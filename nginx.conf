server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolver DNS do Google para o proxy_pass funcionar com domínios
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Redirecionamentos 301 Permanentes Canônicos na borda (consistentes para Bots, Google Validator e Humanos)
    rewrite ^/onde-assistir/(.+)$ https://vibesfilm.com/filme/$1 permanent;
    rewrite ^/(?:blog/)?(?:artigo|analise|lista)/(.+)$ https://vibesfilm.com/blog/artigo/$1 permanent;
    rewrite ^/tag/(.+)$ https://vibesfilm.com/blog/tag/$1 permanent;
    rewrite ^/vibe/(.+)$ https://vibesfilm.com/filmes-para/$1 permanent;
    rewrite ^/blog/?$ https://vibesfilm.com/ permanent;
    rewrite ^/blog/(sobre|contato|privacidade|termos|cookies|categorias)/?$ https://vibesfilm.com/$1 permanent;
    rewrite ^/blog/categoria/(.+)$ https://vibesfilm.com/categoria/$1 permanent;

    # Detecção de Bots para rotas de SEO (artigos, filmes, vibes, blog e páginas institucionais)
    location ~* ^/(filme|filmes-para|blog/artigo|sobre|contato|privacidade|termos|cookies|categorias|categoria|blog/tag)(/.*)?$ {
        if ($http_user_agent ~* "Googlebot|Google-InspectionTool|GoogleOther|Google-Extended|Google-Safety|APIs-Google|Storebot-Google|Bingbot|Chrome-Lighthouse|PageSpeed|WhatsApp|facebookexternalhit|Twitterbot|LinkedInBot|Applebot|Mediapartners-Google|AdsBot-Google") {
            proxy_pass http://vibesfilm-moviesfback-diifom:3333;
            break;
        }
        try_files $uri $uri/ /index.html;
    }

    # Home (raiz exata): bots → SSR no backend | humanos → SPA
    # IMPORTANTE: proxy_pass SEM URI (/ssr-home removido) — nginx exige isso dentro de if
    location = / {
        if ($http_user_agent ~* "Googlebot|Google-InspectionTool|GoogleOther|Google-Extended|Google-Safety|APIs-Google|Storebot-Google|Bingbot|Chrome-Lighthouse|PageSpeed|WhatsApp|facebookexternalhit|Twitterbot|LinkedInBot|Applebot|Mediapartners-Google|AdsBot-Google") {
            proxy_pass http://vibesfilm-moviesfback-diifom:3333;
            break;
        }
        try_files /index.html =404;
    }

    # SPA routing - fallback para o restante da aplicação
    location / {
        try_files $uri $uri/ /index.html;
    }

    # No cache para o shell principal da SPA e arquivos de Service Worker (limpeza de PWA)
    location ~* ^/(index\.html|sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Cache para assets estáticos com hash do Vite
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
